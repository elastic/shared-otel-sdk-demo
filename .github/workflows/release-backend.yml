name: Release Backend

on:
  push:
    tags:
      - 'backend/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#backend/v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar

      - name: Prepare release assets
        working-directory: backend
        run: |
          cp build/libs/backend.jar "backend-${{ env.VERSION }}.jar"
          sha256sum "backend-${{ env.VERSION }}.jar" > "backend-${{ env.VERSION }}.jar.sha256"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/elastic/shared-otel-sdk-demo/backend:${{ env.VERSION }}
            ghcr.io/elastic/shared-otel-sdk-demo/backend:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Backend v${{ env.VERSION }}" \
            --generate-notes \
            "backend/backend-${{ env.VERSION }}.jar" \
            "backend/backend-${{ env.VERSION }}.jar.sha256"
